# ShapeNet chairs: N=50, D=16/32, gaussian + gmm + ddpm.
# Same as the validated baseline (shapenet_overnight_n50.yaml, chamfer 0.129,
# IoU 0.144) but with denser point sampling to test whether the "blobby,
# missing thin detail" look is a supervision-density limit rather than a
# capacity/architecture one. debug_decode.py at resolution 48/64/96 on the
# baseline checkpoint showed verts/faces scaling ~as expected for a fixed
# smooth surface (no new detail appearing at higher eval resolution), so the
# limitation is in what the decoder learned, not in the marching-cubes grid.
# This config doubles num_points (8000->16000, more candidates per shape,
# same 90/10 surface/uniform split and same sigmas) and points_per_shape
# (1024->2048, denser supervision per gradient step) -- pure data-density
# changes, no architecture/loss changes, so risk of regression (e.g. |z|
# collapse) is low relative to eikonal/hidden_dim/surface_ratio experiments.
#
#   python scripts/run_grid.py --config configs/shapenet_n50_dense.yaml \
#       --output outputs/shapenet_n50_dense --only-D 16
seed: 0
device: cuda

data:
  source: mesh_dir
  mesh_dir: /local_disk0/3d_project/shapenet/03001627
  num_points: 16000          # was 8000 -- more near-surface candidates/shape
  surface_ratio: 0.9
  sigmas: [0.005, 0.02]
  num_surface_points: 2048
  mesh_resolution: 48

decoder:
  hidden_dim: 256
  num_layers: 8
  skip_in: [4]
  dropout_prob: 0.0
  use_weight_norm: true
  use_tanh: false
  geometric_init: true
  init_radius: 0.5

stage1:
  num_iters: 8000
  shapes_per_batch: 16
  points_per_shape: 2048     # was 1024 -- denser supervision per iteration
  lr_decoder: 1.0e-3
  lr_codes: 1.0e-3
  clamp_delta: 0.1
  code_init_std: 0.01
  code_reg_lambda: 1.0e-4

gaussian:
  covariance: full
  reg: 1.0e-5

gmm:
  num_components: 5
  reg: 1.0e-5
  max_iters: 200
  min_points_per_component: 5

ddpm:
  num_timesteps: 200
  beta_start: 1.0e-4
  beta_end: 0.02
  schedule: cosine
  hidden_dim: 256
  num_layers: 4
  time_embed_dim: 64
  lr: 1.0e-3
  num_iters: 3000
  batch_size: 64

eval:
  num_generated: 40
  num_reference: 40
  surface_points: 2048
  recon_resolution: 48
  iou_resolution: 32
  max_recon_shapes: 10
  decode_device: cpu

grid:
  N: [50]
  D: [16, 32]
  generators: [gaussian, gmm, ddpm]
