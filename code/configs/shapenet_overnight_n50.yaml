  # ShapeNet chairs: N=50, D=16/32, gaussian + gmm + ddpm.
  # Primary real-data run. Decoder settings match validated shapenet_quick_n10.
  # Databricks: patch_mode=quality, g5.8xlarge, only-D 16 first.
  #
  #   python scripts/run_grid.py --config configs/shapenet_overnight_n50.yaml \
  #       --output outputs/shapenet_overnight_n50 --only-D 16
  seed: 0
  device: cuda

  data:
    source: mesh_dir
    mesh_dir: /local_disk0/3d_project/shapenet/03001627
    num_points: 8000
    surface_ratio: 0.9   # reverted: 0.7 caused |z| collapse (too few near-surface samples)
    sigmas: [0.005, 0.02]
    num_surface_points: 2048
    mesh_resolution: 48

decoder:
  # Reverted: hidden_dim=512 collapsed |z| even with use_tanh=false and
  # lr_codes==lr_decoder, so the earlier collapse wasn't purely a tanh/lr
  # issue -- wider decoders can explain shape variance through their own
  # weights instead of the codes. Fixing this needs real retuning
  # (lr schedule, warmup, etc), not a one-line change. 256 is the validated,
  # stable width; N=50/D=16/hidden_dim=256 (chamfer 0.129, IoU 0.144) is our
  # best result and is what capacity/data trade-offs are measured against.
  hidden_dim: 256
  num_layers: 8
    skip_in: [4]
    dropout_prob: 0.0
    use_weight_norm: true
    use_tanh: false
    geometric_init: true
    init_radius: 0.5

  stage1:
    num_iters: 8000
    shapes_per_batch: 16
    points_per_shape: 1024
    lr_decoder: 1.0e-3
    lr_codes: 1.0e-3
    clamp_delta: 0.1
    code_init_std: 0.01
    code_reg_lambda: 1.0e-4

  gaussian:
    covariance: full
    reg: 1.0e-5

  gmm:
    num_components: 5
    reg: 1.0e-5
    max_iters: 200
    min_points_per_component: 5

  ddpm:
    num_timesteps: 200
    beta_start: 1.0e-4
    beta_end: 0.02
    schedule: cosine
    hidden_dim: 256
    num_layers: 4
    time_embed_dim: 64
    lr: 1.0e-3
    num_iters: 3000
    batch_size: 64

  eval:
    num_generated: 40
    num_reference: 40
    surface_points: 2048
    recon_resolution: 48
    iou_resolution: 32
    max_recon_shapes: 10
    decode_device: cpu

  grid:
    N: [50]
    D: [16, 32]
    generators: [gaussian, gmm, ddpm]
