# Primary experiment: ShapeNet chairs (synset 03001627), N x D grid.
# Matches the proposal sweep on real meshes — synthetic configs are smoke-only.
#
# Databricks (g5.8xlarge, patch_mode=quality):
#   run_config: configs/shapenet_grid.yaml
#   output_name: shapenet_grid
#
# Single cell:
#   python scripts/run_grid.py --config configs/shapenet_grid.yaml \
#       --output outputs/shapenet_grid --only-N 50 --only-D 16
seed: 0
device: cuda

data:
  source: mesh_dir
  mesh_dir: /local_disk0/3d_project/shapenet/03001627
  num_points: 8000
  surface_ratio: 0.9   # reverted: 0.7 caused |z| collapse (too few near-surface samples)
  sigmas: [0.005, 0.02]
  num_surface_points: 2048
  mesh_resolution: 48

decoder:
  hidden_dim: 256
  num_layers: 8
  skip_in: [4]
  dropout_prob: 0.0
  use_weight_norm: true
  use_tanh: false
  geometric_init: true
  init_radius: 0.5

stage1:
  num_iters: 8000
  # 48/150 = 32% coverage per iter, matching the validated N=50 run (16/50 = 32%).
  # random_batch() clamps to min(shapes_per_batch, N), so this is safe for N=10 too.
  shapes_per_batch: 48
  points_per_shape: 1024
  lr_decoder: 1.0e-3
  lr_codes: 1.0e-3
  clamp_delta: 0.1
  code_init_std: 0.01
  code_reg_lambda: 1.0e-4

gaussian:
  covariance: full
  reg: 1.0e-5

gmm:
  num_components: 5
  reg: 1.0e-5
  max_iters: 200
  min_points_per_component: 5

ddpm:
  num_timesteps: 200
  beta_start: 1.0e-4
  beta_end: 0.02
  schedule: cosine
  hidden_dim: 256
  num_layers: 4
  time_embed_dim: 64
  lr: 1.0e-3
  num_iters: 3000
  batch_size: 64

eval:
  num_generated: 40
  num_reference: 40
  surface_points: 2048
  recon_resolution: 48
  iou_resolution: 32
  max_recon_shapes: 10
  decode_device: cpu

grid:
  N: [10, 50, 150]
  D: [16, 32]
  generators: [gaussian, gmm, ddpm]
