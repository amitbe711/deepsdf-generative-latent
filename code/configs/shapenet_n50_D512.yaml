# Closes an open caveat in the report's "Latent dimension, and a correction"
# paragraph: the D=16->32 ablation at N=50 reverses post-watertight-fix
# (capacity now helps: chamfer 0.0361->0.0145), which is offered as evidence
# that the pre-fix "more capacity, worse mesh" finding was a symptom of the
# corrupted SDF sign, not a real capacity effect. But the *original* pre-fix
# symptom that started this whole investigation was hidden_dim=512 (decoder
# width), not the latent dimension D -- and that decoder width was never
# re-run post-repair. This config does exactly that: same N=50, D=16 cell as
# the main sweep, decoder hidden_dim 256->512, everything else in data/
# stage1/eval held identical to configs/shapenet_grid.yaml so the only
# deliberate variable is decoder capacity.
#
# One necessary deviation: lr_decoder/lr_codes 1e-3->3e-4. This is NOT part of
# the capacity variable under test -- it is a separate, already-diagnosed
# optimizer-instability fact (see configs/shapenet_n50_scaleup.yaml's header):
# hidden_dim=512 with weight_norm simply does not train at lr=1e-3 (recon loss
# stays flat), regardless of the watertight fix. Running at 1e-3 here would
# not test capacity at all, just reproduce that stall. So this is the cleanest
# available comparison, not a perfectly lr-matched one -- report it with that
# caveat rather than silently presenting it as isolated.
#
#   python scripts/run_grid.py --config configs/shapenet_n50_D512.yaml \
#       --output outputs/shapenet_n50_D512
seed: 0
device: cuda

data:
  source: mesh_dir
  mesh_dir: /local_disk0/3d_project/shapenet/03001627
  num_points: 8000
  surface_ratio: 0.9
  sigmas: [0.005, 0.02]
  num_surface_points: 2048
  mesh_resolution: 48

decoder:
  hidden_dim: 512            # was 256 in the main sweep -- the variable under test
  num_layers: 8
  skip_in: [4]
  dropout_prob: 0.0
  use_weight_norm: true
  use_tanh: false
  geometric_init: true
  init_radius: 0.5

stage1:
  num_iters: 8000            # identical to the main sweep
  shapes_per_batch: 48
  points_per_shape: 1024
  lr_decoder: 3.0e-4         # was 1e-3 -- necessary stability fix, see header
  lr_codes: 3.0e-4
  clamp_delta: 0.1
  code_init_std: 0.01
  code_reg_lambda: 1.0e-4

gaussian:
  covariance: full
  reg: 1.0e-5

gmm:
  num_components: 5
  reg: 1.0e-5
  max_iters: 200
  min_points_per_component: 5

ddpm:
  num_timesteps: 200
  beta_start: 1.0e-4
  beta_end: 0.02
  schedule: cosine
  hidden_dim: 256
  num_layers: 4
  time_embed_dim: 64
  lr: 1.0e-3
  num_iters: 3000
  batch_size: 64

eval:
  num_generated: 40
  num_reference: 40
  surface_points: 2048
  recon_resolution: 48
  iou_resolution: 32
  max_recon_shapes: 10
  decode_device: cpu

grid:
  N: [50]
  D: [512]
  generators: [gaussian, gmm, ddpm]
