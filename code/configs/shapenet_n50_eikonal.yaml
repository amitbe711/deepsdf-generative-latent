# ShapeNet chairs: N=50, D=16/32, gaussian + gmm + ddpm.
# Same as shapenet_overnight_n50.yaml (our validated baseline: chamfer 0.129,
# IoU 0.144) but with Eikonal regularization enabled to fix the root cause of
# blob-like/incoherent decodes: clamped-L1 only constrains the SDF AT sampled
# points, so between them the field can behave arbitrarily. Eikonal penalizes
# || grad_x f(z, x) || != 1, pushing the network toward a genuine metric SDF.
# Needs an A100/L4 (double backward pass -> ~2x memory/compute per iter).
#
#   python scripts/run_grid.py --config configs/shapenet_n50_eikonal.yaml \
#       --output outputs/shapenet_n50_eikonal --only-D 16
seed: 0
device: cuda

data:
  source: mesh_dir
  mesh_dir: /local_disk0/3d_project/shapenet/03001627
  num_points: 8000
  surface_ratio: 0.9
  sigmas: [0.005, 0.02]
  num_surface_points: 2048
  mesh_resolution: 48

decoder:
  hidden_dim: 256
  num_layers: 8
  skip_in: [4]
  dropout_prob: 0.0
  use_weight_norm: true
  use_tanh: false
  geometric_init: true
  init_radius: 0.5

stage1:
  num_iters: 8000
  shapes_per_batch: 16
  points_per_shape: 1024
  lr_decoder: 1.0e-3
  lr_codes: 1.0e-3
  clamp_delta: 0.1
  code_init_std: 0.01
  code_reg_lambda: 1.0e-4
  # IGR-style Eikonal weight (Gropp et al., 2020). 0.1 is the literature
  # default, but that's calibrated against an *unclamped* data loss of O(1)
  # scale -- here `recon` is clamped to +/-0.1 (clamp_delta), so it's ~10x
  # smaller than eikonal's naturally O(1) scale. At lambda=0.1 eikonal totally
  # dominated the objective (0.1*eik~0.85 = 0.085 >> recon~0.007) and collapsed
  # to a degenerate, near-z-independent field that never went negative inside
  # the eval cube (0/120 decodes valid). Scale lambda down by ~clamp_delta so
  # eikonal acts as a regularizer, not the dominant term.
  eikonal_lambda: 0.01

gaussian:
  covariance: full
  reg: 1.0e-5

gmm:
  num_components: 5
  reg: 1.0e-5
  max_iters: 200
  min_points_per_component: 5

ddpm:
  num_timesteps: 200
  beta_start: 1.0e-4
  beta_end: 0.02
  schedule: cosine
  hidden_dim: 256
  num_layers: 4
  time_embed_dim: 64
  lr: 1.0e-3
  num_iters: 3000
  batch_size: 64

eval:
  num_generated: 40
  num_reference: 40
  surface_points: 2048
  recon_resolution: 48
  iou_resolution: 32
  max_recon_shapes: 10
  decode_device: cpu

grid:
  N: [50]
  D: [16, 32]
  generators: [gaussian, gmm, ddpm]
