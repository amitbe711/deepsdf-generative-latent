# ShapeNet quick validation: N=10, D=16, all generators.
#
# Tuned for real chairs: tanh off + moderate width (tanh+512 caused |z|->0 collapse on Colab).
# Expect: stage-1 loss < 0.02, |z| ~ 0.3-0.8, valid_ratio=1.0
seed: 0
device: cuda

data:
  source: mesh_dir
  mesh_dir: /content/shapenet/03001627
  num_points: 8000
  surface_ratio: 0.9   # reverted: 0.7 caused |z| collapse (too few near-surface samples)
  sigmas: [0.005, 0.02]
  num_surface_points: 2048
  mesh_resolution: 48

decoder:
  hidden_dim: 256
  num_layers: 8
  skip_in: [4]
  dropout_prob: 0.0
  use_weight_norm: true
  use_tanh: false
  geometric_init: true
  init_radius: 0.5

stage1:
  num_iters: 8000
  shapes_per_batch: 8
  points_per_shape: 1024
  lr_decoder: 1.0e-3
  lr_codes: 1.0e-3
  clamp_delta: 0.1
  code_init_std: 0.01
  code_reg_lambda: 1.0e-4

gaussian:
  covariance: full
  reg: 1.0e-5

gmm:
  num_components: 3
  reg: 1.0e-5
  max_iters: 100
  min_points_per_component: 3

ddpm:
  num_timesteps: 200
  beta_start: 1.0e-4
  beta_end: 0.02
  schedule: cosine
  hidden_dim: 256
  num_layers: 4
  time_embed_dim: 64
  lr: 1.0e-3
  num_iters: 3000
  batch_size: 32

eval:
  num_generated: 20
  num_reference: 20
  surface_points: 2048
  recon_resolution: 48
  iou_resolution: 32
  max_recon_shapes: 10
  decode_device: cpu

grid:
  N: [10]
  D: [16]
  generators: [gaussian, gmm, ddpm]
